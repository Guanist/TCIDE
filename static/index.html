<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCIDE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
/* ── Reset & Variables ── */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1e1e1e;--bg2:#252526;--bg3:#2d2d30;--bg4:#3e3e42;
  --fg:#cccccc;--fg2:#969696;--fg3:#666666;
  --accent:#0078d4;--accent2:#1177bb;--accent3:#005a9e;
  --green:#4ec9b0;--yellow:#dcdcaa;--orange:#ce9178;--red:#f44747;
  --border:#3e3e42;--hover:#094771;
  --sidebar:240px;--activity:48px;--statusbar:24px;--panel:250px;
  --font:Consolas,'Courier New',monospace;
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);font-size:13px}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh}
#main{display:flex;flex:1;overflow:hidden}
#activity-bar{width:var(--activity);background:var(--bg3);display:flex;flex-direction:column;align-items:center;padding:4px 0;border-right:1px solid var(--border)}
#sidebar{width:var(--sidebar);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
#editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#panel-area{height:var(--panel);background:var(--bg2);border-top:1px solid var(--border);display:none;flex-direction:column}
#status-bar{height:var(--statusbar);background:var(--accent3);display:flex;align-items:center;padding:0 10px;font-size:12px;color:#fff}

/* ── Activity Bar ── */
.activity-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg2);font-size:20px;border-left:2px solid transparent;transition:all .15s}
.activity-btn:hover{color:var(--fg)}
.activity-btn.active{color:var(--fg);border-left-color:var(--accent)}

/* ── Sidebar ── */
#sidebar-header{padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--fg2);border-bottom:1px solid var(--border)}
#file-tree{flex:1;overflow-y:auto;padding:4px 0}
.tree-item{display:flex;align-items:center;padding:2px 8px;cursor:pointer;font-size:13px;white-space:nowrap}
.tree-item:hover{background:var(--bg4)}
.tree-item.selected{background:var(--hover)}
.tree-item .icon{width:16px;margin-right:4px;font-size:14px}
.tree-item .name{overflow:hidden;text-overflow:ellipsis}
.tree-children{padding-left:16px}
.tree-dir>.icon::before{content:'';background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%2214%22%20viewBox%3D%220%200%2014%2014%22%20fill%3D%22none%22%20stroke%3D%22%2523cccccc%22%20stroke-width%3D%221.3%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M1%203a1%201%200%20011-1h3.5l1.5%202H12a1%201%200%20011%201v6a1%201%200%2001-1%201H2a1%201%200%2001-1-1V3z%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;width:14px;height:14px;display:inline-block}
.tree-file>.icon::before{content:'';background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%2214%22%20viewBox%3D%220%200%2014%2014%22%20fill%3D%22none%22%20stroke%3D%22%2523cccccc%22%20stroke-width%3D%221.3%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%222%22%20y%3D%221%22%20width%3D%2210%22%20height%3D%2212%22%20rx%3D%221%22%2F%3E%3Cpath%20d%3D%22M5%204h4M5%206.5h4M5%209h2%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;width:14px;height:14px;display:inline-block}
.tree-dir.open>.icon::before{content:'';background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%2214%22%20viewBox%3D%220%200%2014%2014%22%20fill%3D%22none%22%20stroke%3D%22%2523cccccc%22%20stroke-width%3D%221.3%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M1%2012V3a1%201%200%20011-1h3.5l1.5%202H12a1%201%200%20011%201v7H5l-1.5-2H1z%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;width:14px;height:14px;display:inline-block}

/* ── Editor Tabs ── */
#editor-tabs{display:flex;background:var(--bg3);overflow-x:auto;min-height:35px}
.tab{display:flex;align-items:center;padding:6px 12px;cursor:pointer;font-size:12px;border-right:1px solid var(--border);white-space:nowrap;gap:6px}
.tab:hover{background:var(--bg4)}
.tab.active{background:var(--bg);border-top:2px solid var(--accent)}
.tab .close{opacity:0;font-size:14px;padding:0 2px;border-radius:3px}
.tab:hover .close{opacity:0.7}
.tab .close:hover{opacity:1;background:var(--red);color:#fff}
.tab .modified{color:var(--orange);margin-left:2px}

/* ── Editor ── */
#editor-container{flex:1;position:relative}
#editor{width:100%;height:100%}
#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--fg3)}
#welcome h1{font-size:32px;color:var(--fg2);margin-bottom:8px}
#welcome p{font-size:14px}

/* ── Terminal ── */
#terminal-container{flex:1;padding:4px}

/* ── AI Panel ── */
#ai-panel{display:none;flex-direction:column;height:100%}
#ai-messages{flex:1;overflow-y:auto;padding:12px}
.ai-msg{margin-bottom:12px;padding:8px 12px;border-radius:8px;max-width:90%;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ai-msg.user{background:var(--accent);color:#fff;margin-left:auto}
.ai-msg.assistant{background:var(--bg3);color:var(--fg)}
.ai-msg.error{background:var(--red);color:#fff}
.ai-msg pre{background:var(--bg);padding:8px;border-radius:4px;overflow-x:auto;margin:8px 0;font-family:var(--font);font-size:12px}
.ai-msg code{font-family:var(--font);background:var(--bg4);padding:1px 4px;border-radius:3px}
#ai-input-area{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
#ai-input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--fg);padding:8px 12px;border-radius:6px;font-size:13px;resize:none;min-height:40px;max-height:120px;font-family:inherit}
#ai-input:focus{outline:none;border-color:var(--accent)}
#ai-send{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
#ai-send:hover{background:var(--accent2)}

/* ── Git Panel ── */
#git-panel{display:none;flex-direction:column;height:100%;padding:12px;overflow-y:auto}
.git-file{display:flex;align-items:center;padding:4px 8px;font-size:12px;gap:8px}
.git-status{font-weight:bold;width:16px;text-align:center}
.git-status.A{color:var(--green)}.git-status.M{color:var(--yellow)}.git-status.D{color:var(--red)}
#git-commit-msg{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--fg);padding:8px;border-radius:4px;font-size:12px;margin-top:8px;resize:none;font-family:inherit}
#git-commit-btn{background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;margin-top:8px;font-size:12px;align-self:flex-end}

/* ── Settings Panel ── */
#settings-panel{display:none;flex-direction:column;height:100%;padding:16px;overflow-y:auto}
#settings-panel h2{font-size:18px;margin-bottom:16px;color:var(--fg)}
.setting-group{margin-bottom:20px}
.setting-group h3{font-size:14px;color:var(--accent);margin-bottom:8px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.setting-row label{font-size:13px;color:var(--fg2)}
.setting-row input,.setting-row select{background:var(--bg3);border:1px solid var(--border);color:var(--fg);padding:4px 8px;border-radius:4px;font-size:12px}

/* ── Problems Panel ── */
#problems-panel{display:none;flex-direction:column;height:100%;padding:8px;overflow-y:auto}
.problem-item{display:flex;align-items:center;padding:4px 8px;font-size:12px;gap:8px;cursor:pointer}
.problem-item:hover{background:var(--bg4)}
.problem-icon.error{color:var(--red)}.problem-icon.warning{color:var(--yellow)}.problem-icon.info{color:var(--accent)}

/* ── Panel Tabs ── */
#panel-tabs{display:flex;background:var(--bg3);border-bottom:1px solid var(--border)}
.panel-tab{padding:6px 16px;font-size:12px;cursor:pointer;color:var(--fg2);border-bottom:2px solid transparent}
.panel-tab:hover{color:var(--fg)}
.panel-tab.active{color:var(--fg);border-bottom-color:var(--accent)}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--fg3)}

/* ── Loading ── */
.spinner{width:20px;height:20px;border:2px solid var(--fg3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
// ═══════════════════════════════════════════════
// TCIDE Frontend
// ═══════════════════════════════════════════════

const API = '';  // 同源，无需前缀

// ── State ──
const state = {
  projectPath: '',
  openFiles: [],      // {path, name, content, language, modified}
  activeFile: -1,
  terminalId: null,
  terminal: null,
  terminalFitAddon: null,
  monaco: null,
  monacoEditor: null,
  currentView: 'explorer',
  aiMessages: [],
  aiStreaming: false,
};

// ── Language Map ──
const LANG_MAP = {
  js:'javascript', jsx:'javascript', ts:'typescript', tsx:'typescript',
  py:'python', rb:'ruby', go:'go', rs:'rust', java:'java', kt:'kotlin',
  c:'c', cpp:'cpp', h:'c', hpp:'cpp', cs:'csharp',
  html:'html', htm:'html', css:'css', scss:'scss', less:'less',
  json:'json', xml:'xml', yaml:'yaml', yml:'yaml', toml:'toml',
  md:'markdown', sql:'sql', sh:'shell', bash:'shell', ps1:'powershell',
  dockerfile:'dockerfile', vue:'html', svelte:'html',
};

function getLang(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  return LANG_MAP[ext] || 'plaintext';
}

// ═══════════════════════════════════════════════
// Monaco Editor
// ═══════════════════════════════════════════════

function initMonaco() {
  require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    state.monaco = monaco;
    state.monacoEditor = monaco.editor.create(document.getElementById('editor'), {
      value: '',
      language: 'plaintext',
      theme: 'vs-dark',
      automaticLayout: true,
      fontSize: 14,
      tabSize: 4,
      wordWrap: 'on',
      minimap: { enabled: false },
      fontFamily: "Consolas, 'Courier New', monospace",
      lineHeight: 22,
      padding: { top: 8 },
      scrollBeyondLastLine: false,
      smoothScrolling: true,
      cursorBlinking: 'smooth',
      renderWhitespace: 'selection',
    });

    // 光标位置变化 → 更新状态栏
    state.monacoEditor.onDidChangeCursorPosition(e => {
      document.getElementById('status-line').textContent = `行 ${e.position.lineNumber}, 列 ${e.position.column}`;
    });

    // 内容变化 → 标记已修改
    state.monacoEditor.onDidChangeModelContent(() => {
      if (state.activeFile >= 0) {
        state.openFiles[state.activeFile].modified = true;
        state.openFiles[state.activeFile].content = state.monacoEditor.getValue();
        renderTabs();
      }
    });

    // Ctrl+S 保存
    state.monacoEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
      saveCurrentFile();
    });
  });
}

// ═══════════════════════════════════════════════
// File Tree
// ═══════════════════════════════════════════════

async function loadFileTree() {
  const resp = await fetch(`${API}/api/files/list?depth=3`);
  const data = await resp.json();
  const tree = document.getElementById('file-tree');
  tree.innerHTML = '';
  if (data.items) {
    data.items.forEach(item => tree.appendChild(createTreeNode(item, 0)));
  }
}

function createTreeNode(item, depth) {
  const div = document.createElement('div');
  const isDir = item.type === 'directory';
  div.className = `tree-item ${isDir ? 'tree-dir' : 'tree-file'}`;
  div.style.paddingLeft = `${8 + depth * 16}px`;
  div.innerHTML = `<span class="icon"></span><span class="name">${item.name}</span>`;

  if (isDir) {
    const children = document.createElement('div');
    children.className = 'tree-children';
    children.style.display = 'none';
    div.addEventListener('click', () => {
      const open = children.style.display !== 'none';
      children.style.display = open ? 'none' : 'block';
      div.classList.toggle('open', !open);
      if (!open && children.children.length === 0 && item.children) {
        item.children.forEach(child => children.appendChild(createTreeNode(child, depth + 1)));
      }
    });
    const wrapper = document.createElement('div');
    wrapper.appendChild(div);
    wrapper.appendChild(children);
    return wrapper;
  }

  div.addEventListener('click', () => openFile(item.path, item.name));
  return div;
}

// ═══════════════════════════════════════════════
// File Operations
// ═══════════════════════════════════════════════

async function openFile(path, name) {
  // 已打开？
  const existing = state.openFiles.findIndex(f => f.path === path);
  if (existing >= 0) {
    switchToFile(existing);
    return;
  }

  const resp = await fetch(`${API}/api/files/read?path=${encodeURIComponent(path)}`);
  const data = await resp.json();
  if (data.error) { showToast(data.error, 'error'); return; }

  const lang = getLang(name);
  state.openFiles.push({ path, name, content: data.content, language: lang, modified: false });
  switchToFile(state.openFiles.length - 1);
}

function switchToFile(index) {
  state.activeFile = index;
  const file = state.openFiles[index];
  if (!file) return;

  document.getElementById('welcome').style.display = 'none';
  document.getElementById('editor').style.display = 'block';

  if (state.monacoEditor) {
    const model = state.monaco.createModel(file.content, file.language);
    state.monacoEditor.setModel(model);
  }

  document.getElementById('status-lang').textContent = file.language;
  renderTabs();
}

async function saveCurrentFile() {
  if (state.activeFile < 0) return;
  const file = state.openFiles[state.activeFile];
  const resp = await fetch(`${API}/api/files/write`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: file.path, content: file.content }),
  });
  const data = await resp.json();
  if (data.success) {
    file.modified = false;
    renderTabs();
    showToast('已保存');
  }
}

function closeFile(index) {
  state.openFiles.splice(index, 1);
  if (state.activeFile >= state.openFiles.length) state.activeFile = state.openFiles.length - 1;
  if (state.activeFile < 0) {
    document.getElementById('editor').style.display = 'none';
    document.getElementById('welcome').style.display = 'flex';
  } else {
    switchToFile(state.activeFile);
  }
  renderTabs();
}

function renderTabs() {
  const container = document.getElementById('editor-tabs');
  container.innerHTML = '';
  state.openFiles.forEach((f, i) => {
    const tab = document.createElement('div');
    tab.className = `tab${i === state.activeFile ? ' active' : ''}`;
    tab.innerHTML = `<span>${f.name}${f.modified ? '<span class="modified"> ●</span>' : ''}</span><span class="close" onclick="event.stopPropagation();closeFile(${i})"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg></span>`;
    tab.addEventListener('click', () => switchToFile(i));
    container.appendChild(tab);
  });
}

// ═══════════════════════════════════════════════
// Terminal
// ═══════════════════════════════════════════════

async function initTerminal() {
  if (state.terminal) return;

  const resp = await fetch(`${API}/api/terminal/create`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cwd: state.projectPath || undefined }),
  });
  const data = await resp.json();
  state.terminalId = data.id;

  state.terminal = new Terminal({
    theme: { background: '#1e1e1e', foreground: '#cccccc', cursor: '#0078d4' },
    fontSize: 14,
    fontFamily: "Consolas, 'Courier New', monospace",
    cursorBlink: true,
  });
  state.terminalFitAddon = new FitAddon.FitAddon();
  state.terminal.loadAddon(state.terminalFitAddon);
  state.terminal.open(document.getElementById('terminal-container'));
  state.terminalFitAddon.fit();

  // WebSocket 连接
  const ws = new WebSocket(`ws://${location.host}/ws/terminal/${data.id}`);
  ws.onmessage = e => state.terminal.write(e.data);
  ws.onclose = () => state.terminal.write('\r\n[Terminal disconnected]\r\n');

  state.terminal.onData(data => ws.send(data));

  window.addEventListener('resize', () => state.terminalFitAddon?.fit());
}

// ═══════════════════════════════════════════════
// AI Chat
// ═══════════════════════════════════════════════

async function sendAiMessage() {
  const input = document.getElementById('ai-input');
  const text = input.value.trim();
  if (!text || state.aiStreaming) return;
  input.value = '';

  state.aiMessages.push({ role: 'user', content: text });
  renderAiMessages();

  state.aiStreaming = true;
  const assistantDiv = addAiMessage('assistant', '');

  try {
    const resp = await fetch(`${API}/api/ai/chat/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: state.aiMessages }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const chunk = JSON.parse(line.slice(6));
          if (chunk.delta) {
            fullText += chunk.delta;
            assistantDiv.querySelector('.content').textContent = fullText;
            scrollAiToBottom();
          }
        } catch {}
      }
    }

    state.aiMessages.push({ role: 'assistant', content: fullText });
  } catch (err) {
    addAiMessage('error', `错误: ${err.message}`);
  } finally {
    state.aiStreaming = false;
  }
}

function addAiMessage(role, content) {
  const div = document.createElement('div');
  div.className = `ai-msg ${role}`;
  div.innerHTML = `<div class="content">${escapeHtml(content)}</div>`;
  document.getElementById('ai-messages').appendChild(div);
  scrollAiToBottom();
  return div;
}

function renderAiMessages() {
  const container = document.getElementById('ai-messages');
  container.innerHTML = '';
  state.aiMessages.forEach(m => addAiMessage(m.role, m.content));
}

function scrollAiToBottom() {
  const el = document.getElementById('ai-messages');
  el.scrollTop = el.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ═══════════════════════════════════════════════
// Git
// ═══════════════════════════════════════════════

async function loadGitStatus() {
  const resp = await fetch(`${API}/api/git/status`);
  const data = await resp.json();
  const container = document.getElementById('git-files');
  container.innerHTML = '';
  if (data.files) {
    data.files.forEach(f => {
      const div = document.createElement('div');
      div.className = 'git-file';
      div.innerHTML = `<span class="git-status ${f.status === '??' ? 'A' : f.status === 'D' ? 'D' : 'M'}">${f.status}</span><span>${f.path}</span>`;
      container.appendChild(div);
    });
  }

  // 更新分支
  const branchResp = await fetch(`${API}/api/git/branches`);
  const branchData = await branchResp.json();
  if (branchData.current) {
      document.getElementById('status-branch').textContent = '<svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="4" r="1.5"/><circle cx="10" cy="4" r="1.5"/><circle cx="7" cy="11" r="1.5"/><path d="M4 5.5v2.5M10 5.5v2.5M7 9.5v-1.5M4 8h6"/></svg>' + ' ' + branchData.current;
  }
}

async function gitCommit() {
  const msg = document.getElementById('git-commit-msg').value.trim();
  if (!msg) return;

  await fetch(`${API}/api/git/stage`, { method: 'POST' });
  const resp = await fetch(`${API}/api/git/commit`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: msg }),
  });
  const data = await resp.json();
  if (data.success) {
    document.getElementById('git-commit-msg').value = '';
    showToast('已提交: ' + msg);
    loadGitStatus();
  } else {
    showToast(data.stderr || '提交失败', 'error');
  }
}

// ═══════════════════════════════════════════════
// Settings
// ═══════════════════════════════════════════════

async function loadSettings() {
  const resp = await fetch(`${API}/api/settings`);
  const data = await resp.json();
  if (data.ai) {
    document.getElementById('set-provider').value = data.ai.provider || 'deepseek';
    document.getElementById('set-baseurl').value = data.ai.baseUrl || '';
    document.getElementById('set-apikey').value = data.ai.apiKey || '';
    document.getElementById('set-model').value = data.ai.model || '';
  }
  if (data.fontSize) document.getElementById('set-fontsize').value = data.fontSize;
  if (data.tabSize) document.getElementById('set-tabsize').value = data.tabSize;
  if (data.wordWrap) document.getElementById('set-wordwrap').value = data.wordWrap;
}

async function saveAiSettings() {
  const config = {
    provider: document.getElementById('set-provider').value,
    baseUrl: document.getElementById('set-baseurl').value,
    apiKey: document.getElementById('set-apikey').value,
    model: document.getElementById('set-model').value,
  };
  await fetch(`${API}/api/settings/ai`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(config),
  });
  // 配置 AI 引擎
  await fetch(`${API}/api/ai/configure`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      provider: config.provider === 'ollama' ? 'ollama' : config.provider === 'anthropic' ? 'anthropic' : 'openai-compatible',
      base_url: config.baseUrl,
      api_key: config.apiKey,
      model: config.model,
    }),
  });
  document.getElementById('status-ai').innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="10" height="8" rx="2"/><circle cx="5" cy="8" r="1" fill="currentColor"/><circle cx="9" cy="8" r="1" fill="currentColor"/><path d="M7 1v3M4 2h6"/><path d="M5 11h4"/></svg> ${config.model || '已配置'}`;
  showToast('AI 配置已保存');
}

// ═══════════════════════════════════════════════
// View Switching
// ═══════════════════════════════════════════════

document.querySelectorAll('.activity-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const view = btn.dataset.view;
    switchView(view);
  });
});

function switchView(view) {
  state.currentView = view;
  document.querySelectorAll('.activity-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));

  // Sidebar
  const sidebar = document.getElementById('sidebar');
  const panelArea = document.getElementById('panel-area');

  if (view === 'explorer' || view === 'search') {
    sidebar.style.display = 'flex';
    panelArea.style.display = 'none';
    document.getElementById('sidebar-header').textContent = view === 'explorer' ? '资源管理器' : '搜索';
  } else if (view === 'terminal' || view === 'ai' || view === 'git' || view === 'settings' || view === 'problems') {
    sidebar.style.display = 'none';
    panelArea.style.display = 'flex';
    switchPanel(view);
  } else {
    sidebar.style.display = 'none';
    panelArea.style.display = 'none';
  }
}

function switchPanel(panel) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.dataset.panel === panel));
  document.getElementById('terminal-container').style.display = panel === 'terminal' ? 'flex' : 'none';
  document.getElementById('ai-panel').style.display = panel === 'ai' ? 'flex' : 'none';
  document.getElementById('git-panel').style.display = panel === 'git' ? 'flex' : 'none';
  document.getElementById('settings-panel').style.display = panel === 'settings' ? 'flex' : 'none';
  document.getElementById('problems-panel').style.display = panel === 'problems' ? 'flex' : 'none';

  if (panel === 'terminal' && !state.terminal) initTerminal();
  if (panel === 'git') loadGitStatus();
  if (panel === 'settings') loadSettings();
}

document.querySelectorAll('.panel-tab').forEach(tab => {
  tab.addEventListener('click', () => switchPanel(tab.dataset.panel));
});

async function openProject() {
  const path = prompt('项目路径：');
  if (!path) return;

  const resp = await fetch(`${API}/api/project/open`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path }),
  });
  const data = await resp.json();
  if (data.error) { showToast(data.error, 'error'); return; }

  state.projectPath = data.path;
  document.getElementById('status-project').innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3a1 1 0 011-1h3.5l1.5 2H12a1 1 0 011 1v6a1 1 0 01-1 1H2a1 1 0 01-1-1V3z"/></svg> ${data.name}`;
  document.title = `TCIDE - ${data.name}`;
  loadFileTree();
}

// ═══════════════════════════════════════════════
// AI Input Auto-resize
// ═══════════════════════════════════════════════

document.getElementById('ai-input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('ai-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendAiMessage();
  }
});

// ═══════════════════════════════════════════════
// Toast
// ═══════════════════════════════════════════════

function showToast(msg, type = 'info') {
  const div = document.createElement('div');
  div.style.cssText = `position:fixed;bottom:40px;right:16px;padding:8px 16px;border-radius:6px;font-size:13px;z-index:9999;color:#fff;background:${type === 'error' ? '#f44747' : '#0078d4'};opacity:0;transition:opacity .3s`;
  div.textContent = msg;
  document.body.appendChild(div);
  requestAnimationFrame(() => div.style.opacity = '1');
  setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 300); }, 3000);
}
