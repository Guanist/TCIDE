name: frontend

# 为什么单独一个工作流：本机在**仓库外两层**存在一个损坏的 package.json
# （Desktop/Vincent/package.json，内容是截断的 React Native 清单）。esbuild 在为
# vite.config.ts 解析模块类型时会向上查找并读到它，于是本地 `vite build` 必然失败：
#     ../../../../package.json:55:15: ERROR: Unterminated string literal
# 代码本身是好的（本地已经跑到 1064 modules transformed）。CI runner 的祖先链干净，
# 所以"前端能不能重建"这件事在这里才验证得准。
#
# 这个工作流的价值：把"前端可重建"变成**持续可验证**的事实 —— 一旦源码被改坏，
# 这里会红。

on:
  push:
    branches: [main, tcide-py]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装构建所需依赖（不装 Electron）
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm install --no-save --no-audit --no-fund vite@5.4.21

      - name: 确认没有把 Electron 拉进来
        run: |
          if [ -d node_modules/electron ]; then
            echo "::warning::node_modules 里出现了 electron（构建并不需要它）"
          fi

      - name: 构建渲染层
        run: npx vite build

      - name: 校验产物（缺了就等于没构建）
        run: |
          set -e
          test -f dist/renderer/index.html
          test -d dist/renderer/assets
          echo "产物文件数：$(find dist/renderer -type f | wc -l)"
          # 关键资源必须在：少了 monaco/xterm 的产物，界面会直接不可用
          ls dist/renderer/assets | grep -q 'index-.*\.js'
          ls dist/renderer/assets | grep -q 'index-.*\.css'

      - name: 校验主题真的进了产物（源码 → 构建 → 产物 这条链）
        run: |
          set -e
          echo "=== 产物 CSS 分块 ==="
          ls -la dist/renderer/assets/*.css
          echo "=== 诊断：变量与主题块分布 ==="
          for f in dist/renderer/assets/*.css; do
            printf '%s: --bg-primary=%s light-theme=%s\n' "$f" \
              "$(grep -c -- '--bg-primary' "$f" || true)" \
              "$(grep -ciE 'data-tcide-theme|theme-light' "$f" || true)"
          done

          # 变量定义要在**任意**一个分块里（vite 会分块，不能只看第一个）
          if ! grep -lq -- '--bg-primary' dist/renderer/assets/*.css; then
            echo "::error::所有产物 CSS 里都没有 --bg-primary —— 主题变量没进产物"
            exit 1
          fi
          # 浅色主题块要在；压缩后引号可能被去掉，两种写法都接受
          if ! grep -lEqi 'data-tcide-theme="?light"?|theme-light' dist/renderer/assets/*.css; then
            echo "::error::产物 CSS 里没有浅色主题块"
            exit 1
          fi
          # 裸色值：这里只**警告**，不判失败。
          # 原因：剩下的裸写来自 Monaco 编辑器主题定义（'editor.background' 等），
          # Monaco 的 API 不接受 CSS 变量 —— 那是合理例外，不是缺陷。
          # 严格的"规则体里不许裸写"由本地测试执行：
          #   tests/test_frontend_theme_source.py::TestBypassConvergence
          if grep -liqE '#1e1e1e' dist/renderer/assets/*.css; then
            echo "::warning::产物 CSS 里仍有裸写的 #1e1e1e（Monaco 主题定义等合理例外；严格规则见本地源码测试）"
          fi
          grep -q '/static/tcide-theme.js' dist/renderer/index.html
          echo "OK: 主题变量、浅色主题、切换脚本都已在产物中"
      - name: 在产物里写下提交号（供同步工具比对，防止同步到旧的构建）
        run: |
          echo "${GITHUB_SHA}" > dist/renderer/COMMIT
          cat dist/renderer/COMMIT

      - name: 上传产物（便于人工核对）
        uses: actions/upload-artifact@v4
        with:
          name: renderer-dist
          path: dist/renderer
          retention-days: 7
          if-no-files-found: error
