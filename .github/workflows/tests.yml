name: tests

# 原版 TCIDE 的工程缺口之一是"0 测试、无 CI"。测试这一半在本仓库已经补上
# （213 条，且**完全不依赖 Qt**），这个工作流把另一半也补上：每次都真的跑。

on:
  push:
    branches: [main, tcide-py]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 只装测试真正需要的依赖。
      # **刻意不装 pywebview**：那是桌面窗口用的，Linux 上还要 GTK/WebKit 系统库，
      # 而测试全都不需要它（已验证 tests/ 里没有任何 Qt/WebView 依赖）。
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx pydantic python-multipart gitpython openai

      - name: 跑测试
        # DAP 集成测试默认跳过（需要 debugpy 且本机偶发），要跑就设 TCIDE_DAP_TESTS=1
        run: python -m pytest -q -p no:cacheprovider

      - name: 接口对账（前端调用 vs 后端路由，信息性）
        # 信息性步骤：输出"前端调用但后端没有"的接口清单，当前为 0 个。
        run: python tools/api_audit.py || true
